{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">{{ grimoire.title }}</h1>
  <p class="mb-2"><strong>Kategori:</strong> {{ grimoire.category }}</p>
  <div class="prose max-w-none">
    {{ grimoire.content|linebreaks }}
  </div>
  <div class="mt-4 flex gap-2">
    <a href="{% url 'preservation_grimoire:grimoire_edit' grimoire.pk %}" class="bg-yellow-500 text-white px-4 py-2 rounded">Edit</a>
    <a href="{% url 'preservation_grimoire:grimoire_list' %}" class="bg-gray-500 text-white px-4 py-2 rounded">Kembali</a>
  </div>
</div>
{% endblock %}
